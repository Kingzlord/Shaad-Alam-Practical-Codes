<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shadow Escape</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Shadow Escape</h1>
  <p id="subtitle">Escape the light.</p>

  <canvas id="gameCanvas" width="800" height="500"></canvas>

  <p id="message"></p>

  <div id="levelMenu" style="display: none;">
    <h2>Select a Level</h2>
    <button onclick="loadLevel('tutorial')">Tutorial</button>
    <button id="level1Btn" onclick="loadLevel('level1')" disabled>Level 1</button>
    <button id="level2Btn" onclick="loadLevel('level2')" disabled>Level 2</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
