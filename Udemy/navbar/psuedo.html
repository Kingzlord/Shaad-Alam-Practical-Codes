<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Navigation</title>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        margin: 0;
        padding: 20px;
        background-color: #1a1a1a;
        color: white;
      }
      .nav-container {
        margin-bottom: 50px;
      }
      h2 {
        margin-bottom: 10px;
      }
      .nav1 {
        /* border: solid red; */
        background-color: #5f5f60;
        padding: 0.2px 0px 0.2px 0px;
        border-radius: 11px;
        padding: 5px 0 5px 0;
      }
      .nav1 ul {
        list-style-type: none;
        margin: 5px;
        padding: 0;
        display: flex;
        justify-content: space-around;
      }
      .nav1 li {
        display: inline;
      }
      .nav1 a {
        text-decoration: none;
        color: white;
        border-radius: 10px;
        /* background-color: #004bec; */
        padding: 5px 10px;
        position: relative;
      }
      .nav1 a::after {
        content: "Google Form";
        position: absolute;
        width: 100%;
        height: 2px;
        bottom: 0;
        left: 0;
        background-color: #57c2fc;
        transform: scaleX(0);
        transition: transform 0.3s ease-in-out;
      }
      .nav1 a:hover::after {
        transform: scaleX(0.8);
      }
      .nav1 .login-btn {
        color: white;
        background-color: #000000;
        font-family: "Times New Roman", Times, serif;
        border-radius: 10px;
        cursor: crosshair;
        font-size: large;
        position: relative;
      }
      .nav1 .login-btn::after {
        content: "";
        position: absolute;
        width: 100%;
        height: 2px;
        bottom: 0;
        left: 0;
        background-color: #57c2fc;
        transform: scaleX(0);
        transition: transform 0.3s ease-in-out;
      }
      .nav1 .login-btn:hover::after {
        transform: scaleX(0.9);
      }
      .nav2 {
        border-radius: 15px;
        background: linear-gradient(135deg, #ff0000, #7e98e4);
        /* background-size: 200% 200%; */
        /* background-position: left; */
        width: 100px;
        padding: 25px;
        font-weight: bold;
        font-family: Arial, Helvetica, sans-serif;
        /* transition: background-position 0.5s ease-in-out; */
        transform: scale(1px);
        transition: transform 0.5s ease-in-out;
      }

      .nav2:hover {
        transform: scale(1.5px);
      }

      .nav2 ul {
        list-style-type: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
      }
      .nav2 li {
        margin-bottom: 10px;
      }
      .nav2 a {
        text-decoration: none;
        color: black;
        display: block;
        padding: 10px;
        width: 100%;
        width: 70px;
        border-radius: 10px;
        transform: scale(1);
        transition:
          background-color 0.5s ease-in-out,
          transform 0.5s ease-in-out;
      }
      .nav2 a:hover {
        width: 100%;
        transform: scale(1.5);
        background-color: #ffbf00;
        width: 70px;
        border-radius: 10px;
      }
      .nav2 .login-btn {
        background-color: #ffbf00;
        border-radius: 10px;
        border: none;
        cursor: pointer;
        font-size: 16px;
        font-weight: bold;
        margin-left: 9px;
        transform: scale(1);
        transition:
          background-color 0.5s ease-in-out,
          transform 0.5s ease-in-out;
      }
      .nav2 .login-btn:hover {
        background-color: #ffbf00;
        transform: scale(1.5);
      }
      .nav3 {
        background-color: #ff9306;
        padding: 10px;
        border-radius: 10px;
      }
      .nav3 ul {
        list-style-type: none;
        padding: 0;
        margin: 0;
        display: flex;
        justify-content: space-around;
        align-items: center;
      }
      .nav3 a {
        text-decoration: none;
        color: black;
        padding: 10px;
        display: block;
        background-color: transparent;
        border-radius: 10px;
        transition: background-color 0.5s cubic-bezier(1, 1, 0.5, 0.6);
      }
      .nav3 a:hover {
        background-color: rgb(6, 234, 255);
        border-radius: 10px;
      }
      .nav3 .dropdown-content {
        display: none;
      }

      .nav3 .dropdown:hover .dropdown-content {
        display: block;
        position: absolute;
        background-color: #ffdd00;
        border-radius: 10px;
        min-width: 15px;
        box-shadow: 0 8px 20px #00d9ff74;
      }
      .nav3 .login-btn {
        background-color: #00d9ff;
        border-radius: 10px;
        font-size: 15px;
        border: none;
        height: 30px;
        width: 100px;
        cursor: pointer;
        transition: transform 0.9s ease-in-out;
      }
      .nav3 .login-btn:hover {
        background-color: #00d9ff;
        transform: scale(1.5);
      }
    </style>
  </head>
  <body>
    <!-- Nav container 1 -->
    <div class="nav-container">
      <h2>Variation 1: Horizontal with underline effect</h2>
      <nav class="nav1">
        <ul>
          <li><a href="#">Home</a></li>
          <li><a href="#">About</a></li>
          <li><a href="#">Products</a></li>
          <li><button class="login-btn">Login</button></li>
        </ul>
      </nav>
    </div>
    <!-- Nav container 2 -->
    <div class="nav-container">
      <h2>Variation 2: Vertical with hover effect</h2>
      <nav class="nav2">
        <ul>
          <li><a href="#">Home</a></li>
          <li><a href="#">About</a></li>
          <li><a href="#">Products</a></li>
        </ul>
        <button class="login-btn">Login</button>
      </nav>
    </div>
    <!-- Nav container 3 -->
    <div class="nav-container">
      <h2>Variation 3: Horizontal with dropdown</h2>
      <nav class="nav3">
        <ul>
          <li><a href="#">Home</a></li>
          <li class="dropdown">
            <a href="#">About</a>
            <div class="dropdown-content">
              <a href=https://royalcollegelibrary.blogspot.com/www.royl target="_blank" class="a">Our Story</a>
              <a href="#">Web page</a>
              <a href="#">Projects</a>
            </div>
          </li>
          <li><a href="#">Products</a></li>
          <li><button class="login-btn">Login</button></li>
        </ul>
      </nav>
    </div>
  </body>
</html>
