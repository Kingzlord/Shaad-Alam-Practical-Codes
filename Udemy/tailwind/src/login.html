<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./output.css" rel="stylesheet">
    <title>Login page</title>
</head> 
<body class="h-lvh bg-mybg flex justify-center items-center text-white">
    <div class="border-2 border-blue-600 bg-gray-600 p-5 rounded-lg shadow-lg max-w-sm w-full">
        <form>
            <h2 class="text-center text-3xl font-bold">Login Form</h2>
            <div class="mb-2 mt-5">
                <label class="block text-sm font-medium mb-2 pr-8" for="Email">Email</label>
                <input class="focus:outline-none focus:border-blue-600 focus:ring-1 focus:ring-blue-600 border w-full px-5 py-1 rounded-lg mb-2" type="email" placeholder="Email"> 
            </div>
            <hr class="mt-5 mb-5 border-2 border-blue-600 w-full">
            <div class="mb-2">
                <label class="block mb-2 pr-8"  for="Password">Password</label>
                <input class="focus:outline-none focus:border-blue-600 focus:ring-1 focus:ring-blue-600 border w-full px-5 py-1 rounded-lg pr-1 " type="password" placeholder="Password"> <br><br>
            </div>
            <button class="border-2 hover:ring-1 hover:ring-blue-500 transition duration-200 border-gray-600 w-full bg-blue-600 self-center rounded-lg px-2" type="submit">Submit</button>
        </form>
    </div>
</body>
</html>
