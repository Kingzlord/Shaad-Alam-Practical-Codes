<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Intro</title>
    <style>
        .grid-container{
            display: grid;
            grid-template-columns: repeat(3,1fr);
            grid-template-rows: repeat(3,100px);
            /* gap: 2px; */
        }
        .item{
            font-size: 25px;
            background-color: rgb(255, 179, 0);
            border: 1px solid;
        }
        .item:nth-child(3n+1),.item:nth-child(6){
            background-color: rgb(0, 255, 255);
        }
        .item1{
            grid-column: 1/3;
            grid-row: 1/2;
        }
        .item2{
            grid-column: 3/4;
            grid-row: 1/4;
        }
        /* .item6{
            grid-column: ;
        } */
        p{
            font-size: 20px;
            margin: 0px;
            padding: 0px;
        }
    </style>
</head>
<body>
    <div class="grid-container" 
    style="grid-template-areas: 'first second second'
     'third fourth fourth' 'fifth fifth sixth';
     ;">
        <div class="item" style = "grid-area: first;">1
            <div class="grid-container" style="grid-template-areas: 'sub1 sub2';">
                <div class="item" style = "grid-area: sub1;
                background-color: white;"
                >1.1</div>
                <div class="item" style = "grid-area: sub2;">1.2</div>
            </div>
        </div>
        <div class="item" style = "grid-area: second;">2</div>
        <div class="item" style = "grid-area: third;">3</div>
        <div class="item" style = "grid-area: fourth;">4</div>
        <div class="item" style = "grid-area: fifth;">5</div>
        <div class="item" style = "grid-area: sixth;">6</div>
        <!-- <div class="item">7</div> -->


    </div>
</body>
</html>
