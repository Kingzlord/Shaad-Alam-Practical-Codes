<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic webpage</title>
</head>
<style>
    body{
        font-family: Arial, Helvetica, sans-serif;
        line-height: 1.6;
        padding: 10px;
    }
    .test{
        height: 42px;
        width: 100px; 
        color: red;
        background-color: #000000;
    }
    .block-box{
        display: block;
        width: 250px;
        height: 250px;
    }
</style>
<body>
    <p>hey there <br></p>
    <h2>i am bored </h2>
    <div class="test">
        <h1>Hello</h1>
    </div>
    <div class="block-box">
        <p>
            this is an example of block display
            in here the items are displayed as block... 
            and therefore take the whole viewport  it has a
            width and height of 50pxs
        </p>
</div>
</body>
</html>
