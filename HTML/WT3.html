<!doctype html>
<head>
    <meta charset="ÜTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Table and Image Demonstration</title>
    <style>
        body{
            font-family:Arial, sans-serif;
            line-height:1.6;
            background: color #f4f4f4;
            color:#333;
            padding:20px;
        }
        h1{
            text-align:center;
        }
        table{
            width:100%;
            border-collapse:collapse;
            margin:20px 0;
        }
        table,td,th{
            border:1px solid#333;
        }
        td,th{
            padding:10px;
            text-align:center;
        }
        th{
            background-color:#f8d7da
        }
        img{
            width: 700px;
            max-width:100%;
            height:400px;
            display:block;
            margin:10px auto;
            border:2px solid#ccc;
            border-radius:5px;
        }
    </style>
</head>
<body>
    <h1>Table and Image Demonstration</h1>
    <!--Image-->
    <section>
        <h2>Image Example</h2>
        <p>Below is an example of an image displayed using the<code>&lt;img&gt;</code></p>
        <img src="image.jpeg" alt="Sample Image" width="250" height="250">
    </section>
    <!--Table-->
    <section>
        <h2>Table Example</h2>
        <p>The following table demonstrates the use of table tags</p>
        <table>
            <thead>
                <tr>
                    <th>Item</th>
                    <th>Description</th>
                    <th>Price</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Apple</td>
                    <td>Fresh Red Apples</td>
                    <td>$1.50</td>
                </tr>
                <tr>
                    <td>Banana</td>
                    <td>Sweet and Yellow Bananas</td>
                    <td>$1.20</td>
                </tr>
                <tr>
                    <td>Orange</td>
                    <td>Juicy Oranges</td>
                    <td>$1.80</td>
                </tr>
            </tbody>
        </table>
    </section>
</body>
</html>
