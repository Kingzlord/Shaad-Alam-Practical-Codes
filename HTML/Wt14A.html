<!doctype html>
<html>
    <head>
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
        <script>
            $(document).ready(function(){
                $("p").mouseover(function(){
                    $("p").css("background-color","yellow");
                });
                $("p").mouseout(function(){
                    $("p").css("background-color","lightgray");
                });
            });
        </script>
    </head>
    <body>
        <p>abcdefg</p>
    </body>
</html>
