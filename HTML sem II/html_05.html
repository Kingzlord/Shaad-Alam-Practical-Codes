<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Demonstration</title>
    <!-- Embedded CSS (Internal stylesheet) -->
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        background-color: #555555;
      }
      h1 {
        color: white;
        text-align: center;
      }
      p {
        color: rgb(254, 165, 232);
        font-size: 25px;
      }
      .embedded-box {
        background-color: #fdfbfb;
        color: rgb(119, 112, 112);
        padding: 20px;
        margin: 10px;
        text-align: center;
      }
    </style>

    <!-- Link to External CSS file -->
    <link rel="stylesheet" href="style05.css" />
  </head>
  <body>
    <h1>CSS Demonstration</h1>
    <!-- Embedded Styles -->
    <div class="embedded-box">
      <h2>Embedded CSS Box</h2>
      <p>
        This is an example of an element styled using an embedded (Internal)
        style stylesheet
      </p>
    </div>
    <div class="external-box">
      <h2>External CSS Box</h2>
      <p>This is an example of an element styled using an external style</p>
    </div>
    <!-- Inline styles -->
    <div
      style="
        background-color: #000000;
        color: rgb(128, 151, 254);
        padding: 10px;
        margin: 20px;
        text-align: center;
      "
    >
      <h2>Inline CSS box</h2>
      <p style="color: rgb(122, 222, 236)">
        This is an example of an element styled using an inile style
      </p>
    </div>
  </body>
</html>
