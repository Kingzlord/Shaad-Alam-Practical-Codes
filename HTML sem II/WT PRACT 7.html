<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Styling-Flexbox Example</title>
    <style>
      body {
        background: url("https://images.pexels.com/photos/417074/pexels-photo-417074.jpeg?_gl=1*q8tdml*_ga*MjA3ODc0NDgzOS4xNzY2NDE2NDc1*_ga_8JE65Q40S6*czE3NjY0MTY0NzQkbzEkZzAkdDE3NjY0MTY0NzQkajYwJGwwJGgw");
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        margin: 0;
        padding: 0;
        font-family: "Arial", sans-serif;
      }
      h1 {
        font-family: "Georgia", serif;
        font-size: 50px;
        color: #ffffff;
        text-align: center;
        margin-top: 50px;
        text-shadow: 4px 4px 6px rgba(255, 250, 250, 0.6);
      }
      h2 {
        font-family: "Verdana", sans-serif;
        font-size: 30px;
        color: #ffcc00;
        font-weight: bold;
        text-align: center;
        margin-bottom: 20px;
      }
      p {
        font-size: 18px;
        line-height: 1.6;
        color: #f1f1f1;
        text-align: justify;
        width: 80%;
        margin: 0 auto;
      }
      .container {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        flex-direction: column;
      }
      .content-box {
        background-color: rgba(0, 0, 0, 0.4); /* still needed */
        backdrop-filter: blur(5px);
        -webkit-backdrop-filter: blur(5px); /* Safari being Safari */
        padding: 40px;
        border-radius: 10px;
        text-align: center;
        width: 80%;
        max-width: 600px;
        box-shadow: 0 4px 10px rgb(255, 98, 98);
      }
      .cta-button { 
        background-color: #ff5959;
        color: #ffffff;
        padding: 15px 30px;
        font-size: 18px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        text-transform: uppercase;
        margin-top: 20px;
        transition: background-color 1s cubic-bezier(0, 0, 0, 0);
      }
      .cta-button:hover {
        background-color: rgba(255, 111, 111, 0);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px); /* Safari being Safari */
        color: white;
        box-shadow: rgba(0, 0, 0, 0.6) 2px 3px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="content-box">
        <h1>Explore the Nature</h1>
        <h2>Discover Beautiful Forests</h2>
        <p>
          Immerse yourself in the tranquility of nature. Enjoy the peacefulness
          of the forests, take in the fresh air, and appreciate the beauty of
          the natural world around you. A perfect escape from the hustle and
          bustle of city life.
        </p>
      </div>
      <button class="cta-button">Learn More</button>
    </div>
  </body>
</html>
